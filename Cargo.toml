[package]
name = "strand_software_rasterizer"
version = "0.1.0"
edition = "2024"

[package.metadata.bevy.asset_metadata]
shaders = { type = "WgslShader" }

[dependencies]
bevy = { version = "0.18", features=["experimental_pbr_pcss"] }
bytemuck = "1.22.0"
encase = "0.12.0"
serde = "1.0.219"
fluent-uri = { version = "0.3.2", features = ["serde"] }
serde_json = "1.0.140"
anyhow = "1.0.97"
lazy_static = "1.5.0"
nonmax = "0.5.5"
offset-allocator = "0.2"
phf = {version="0.13.1", features=["macros"]}
range-alloc = "0.1.4"
wgpu = "27.0.1"
bevy_gpu_paging_allocator={ path="../bevy_gpu_paging_allocator" }
bevy_vsms = { path = "../bevy_vsms" }

[dev-dependencies]
bevy_egui = "0.39.1"
bevy_panorbit_camera = "0.34.0"
default_material = { path = "../../../default_material" }
